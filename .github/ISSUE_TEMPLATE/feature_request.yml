name: Suggest a feature
description: An idea that would make SlingSync more useful for your work
labels: [enhancement]
body:
  - type: dropdown
    id: tool
    attributes:
      label: For which SlingSync?
      options:
        - Desktop app
        - Premiere Pro panel
        - Both
        - Command line
  - type: textarea
    id: idea
    attributes:
      label: What would you like it to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: How would it help your work?
      description: The kind of shoot or workflow, and what you do today instead
