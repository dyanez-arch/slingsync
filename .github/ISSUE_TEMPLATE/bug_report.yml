name: Report a problem
description: Something didn't sync, sync wrongly, crashed, or didn't import into Premiere
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The details below make it possible to find the cause.
        **Privacy:** reports and logs contain file and folder names. Remove anything you don't want to share.
  - type: dropdown
    id: tool
    attributes:
      label: Which SlingSync?
      options:
        - Desktop app
        - Premiere Pro panel
        - Command line
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SlingSync version
      description: "Desktop app: SlingSync → About. Panel: About link at the bottom of the panel. Command line: slingsync --version"
      placeholder: "1.2.0 (build abc1234, 2026-11-18)"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Mac and software
      description: macOS version, Apple Silicon or Intel, and the Premiere Pro version if it matters
      placeholder: "macOS 27.2, Apple Silicon, Premiere Pro 27.0"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      placeholder: "Cam B clips were placed 20 minutes late; they should line up with the recorder."
    validations:
      required: true
  - type: textarea
    id: shoot
    attributes:
      label: The shoot
      description: Devices and file types (e.g. 2 Canon cameras MXF, Zoom F6 recorder WAV, GoPro MP4), proxies or originals, folders or loose files, roughly how many clips
  - type: textarea
    id: report
    attributes:
      label: SlingSync_report.txt
      description: The report SlingSync writes into the shoot folder. Paste it here, or drag the file in.
      render: text
  - type: textarea
    id: details
    attributes:
      label: Details log (optional, very helpful)
      description: "Panel: Show details → Copy details. Command line: run with --verbose and paste the output."
      render: text
