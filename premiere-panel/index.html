<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; font-size: 12px; color: var(--uxp-host-text-color, #ddd);
           background: var(--uxp-host-background-color, #232323); margin: 0; padding: 14px; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    header img { width: 40px; height: 40px; }
    h1 { font-size: 16px; margin: 0; }
    .muted { color: #9a9a9a; }
    button { display: block; width: 100%; margin: 8px 0; padding: 8px; font-size: 12px; }
    #status { margin-top: 12px; padding: 10px; border-radius: 6px; background: rgba(255,255,255,0.06);
              white-space: pre-wrap; min-height: 18px; }
    #status.ok { border-left: 3px solid #3fb950; }
    #status.err { border-left: 3px solid #e5534b; }
    footer { margin-top: 14px; font-size: 11px; }
  </style>
</head>
<body>
  <header>
    <img src="icons/logo.png" alt="">
    <div>
      <h1>SlingSync</h1>
      <div class="muted">Panel prototype 0.1 · step 1: import</div>
    </div>
  </header>

  <p class="muted">Sync a shoot with the SlingSync app first, then import the result into this project.</p>

  <button id="fromFolder">Import from Shoot Folder…</button>
  <button id="fromFile">Import XML File…</button>

  <div id="status"></div>

  <footer class="muted">Coming next: start the sync from here.</footer>

  <script src="index.js"></script>
</body>
</html>
