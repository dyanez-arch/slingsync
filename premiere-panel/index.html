<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; font-size: 12px; color: var(--uxp-host-text-color, #ddd);
           background: var(--uxp-host-background-color, #232323); margin: 0; padding: 14px; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    header img { width: 40px; height: 40px; }
    h1 { font-size: 16px; margin: 0; }
    .muted { color: #9a9a9a; }
    button { display: block; width: 100%; margin: 8px 0; padding: 8px; font-size: 12px; }
    #syncFolder { font-weight: bold; padding: 11px; }
    label { display: flex; align-items: center; gap: 6px; margin: 4px 0 10px; }
    #bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.12); margin-top: 12px; }
    #barFill { height: 6px; border-radius: 3px; background: #3b9cff; width: 0%; }
    #status { margin-top: 10px; padding: 10px; border-radius: 6px; background: rgba(255,255,255,0.06);
              white-space: pre-wrap; min-height: 18px; }
    #status.ok { border-left: 3px solid #3fb950; }
    #status.err { border-left: 3px solid #e5534b; }
    hr { border: none; border-top: 1px solid rgba(255,255,255,0.12); margin: 14px 0 6px; }
  </style>
</head>
<body>
  <header>
    <img src="icons/logo.png" alt="">
    <div>
      <h1>SlingSync</h1>
      <div class="muted">Panel prototype 0.3 · tests</div>
    </div>
  </header>

  <button id="syncFolder">Sync Shoot Folder…</button>
  <label><input type="checkbox" id="audio"> Also export audio files (WAV)</label>
  <div class="muted">Pick a shoot folder (one subfolder per camera or recorder). The SlingSync
    app syncs it, then the synced sequence is imported into this project.</div>

  <div id="bar"><div id="barFill"></div></div>
  <div id="status"></div>

  <hr>
  <div class="muted">Already synced?</div>
  <button id="fromFolder">Import from Shoot Folder…</button>
  <button id="fromFile">Import XML File…</button>

  <hr>
  <details>
    <summary class="muted">Developer tests (temporary)</summary>
    <button id="labWav">Test 1: Read a WAV file…</button>
    <button id="labAme">Test 2: Convert a clip with Media Encoder…</button>
    <button id="labDsp">Test 3: JavaScript speed</button>
    <button id="labDecode">Test 4: Built-in audio decoder?</button>
    <pre id="labOut" style="white-space: pre-wrap; font-size: 11px; user-select: text;"></pre>
  </details>

  <script src="index.js"></script>
  <script src="lab.js"></script>
</body>
</html>
