[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "slingsync"
dynamic = ["version"]
description = "Sync multicam and multitrack audio by sound (no timecode) and export a Premiere Pro XML"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "av>=12.0", "PySide6>=6.6"]

[project.scripts]
slingsync = "slingsync.cli:main"

[project.gui-scripts]
slingsync-app = "slingsync.gui:main"

[tool.setuptools]
packages = ["slingsync"]

[tool.setuptools.package-data]
slingsync = ["resources/*"]

[tool.setuptools.dynamic]
version = { attr = "slingsync.__version__" }
